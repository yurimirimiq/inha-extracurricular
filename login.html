<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 · 인하 비교과 마일리지</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css?v=18">
</head>
<body class="login">
  <section class="login-art">
    <h1>인하 비교과<br>마일리지</h1>
    <p>이번 학기에 열리는 프로그램과<br>내 마일리지를 한 화면에서.</p>
    <!-- 인하대 공식 마스코트(저작권: 인하대학교). 사용 조건은 assets/mascot/README.txt 참고. -->
    <div class="mascots">
      <img src="assets/mascot/annyong-front.png" alt="인하대학교 마스코트 안뇽">
      <img src="assets/mascot/induck-front.png" alt="인하대학교 마스코트 인덕">
    </div>
  </section>

  <main class="login-form">
    <form id="loginForm">
      <h2 id="loginTitle">로그인</h2>
      <label><span id="idLabel">학번</span>
        <input id="sid" inputmode="numeric" autocomplete="username" required autofocus></label>
      <label>비밀번호
        <input id="pw" type="password" autocomplete="off" required></label>
      <button type="submit" class="primary">로그인</button>
      <p class="notice"><strong>지금은 시험 버전이에요.</strong> 아무 값이나 넣어도 들어가지고, 비밀번호는 어디에도 저장하지 않아요.
        인하포털 비밀번호는 넣지 마세요.</p>
      <p class="hint"><a id="switch" href="login.html?staff">교직원이신가요? 교직원 로그인</a></p>
      <p class="hint">인하대학교 공식 서비스가 아니에요. 학생이 만든 비교과 안내 사이트예요. 마스코트 안뇽·인덕의 저작권은 인하대학교에 있어요.</p>
    </form>
  </main>

<script>
  // shortcut: 진짜 로그인이 아님. 학번(교직원은 사번)만 이 브라우저에 기억하고 비밀번호는 버림. 이름·학과는 마이페이지에서 적음. 서버(Supabase)나 학교 로그인으로 바꿀 때 이 부분을 교체.
  const $ = (id) => document.getElementById(id);
  // login.html?staff = 교직원 로그인 (사번·비밀번호 → 교직원 화면)
  const staff = new URLSearchParams(location.search).has('staff');
  if (staff) {
    document.title = '교직원 로그인 · 인하 비교과 마일리지';
    $('loginTitle').textContent = '교직원 로그인';
    $('idLabel').textContent = '사번';
    Object.assign($('switch'), { href: 'login.html', textContent: '학생이신가요? 학생 로그인' });
  }
  $('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    try { localStorage.setItem(staff ? 'inha-staff-session' : 'inha-session', $('sid').value.trim()); } catch { /* 저장소를 못 써도 들어가게 함 */ }
    location.href = staff ? 'admin.html' : 'index.html';
  });
</script>
</body>
</html>
