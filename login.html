<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 · 인하 비교과 마일리지</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css?v=29">
</head>
<body class="login">
  <section class="login-art">
    <h1>인하 비교과<br>마일리지</h1>
    <p>이번 학기에 열리는 프로그램과<br>내 마일리지를 한 화면에서.</p>
    <!-- 인하대 공식 마스코트(저작권: 인하대학교). 사용 조건은 assets/mascot/README.txt 참고. -->
    <div class="mascots">
      <img src="assets/mascot/annyong-front.png" alt="인하대학교 마스코트 안뇽">
      <img src="assets/mascot/induck-front.png" alt="인하대학교 마스코트 인덕">
    </div>
  </section>

  <main class="login-form">
    <form id="loginForm">
      <h2>로그인</h2>
      <div class="pills who" role="radiogroup" aria-label="로그인 종류">
        <label><input type="radio" name="who" value="student" checked>학생</label>
        <label><input type="radio" name="who" value="staff">교직원</label>
      </div>
      <label><span id="idLabel">학번</span>
        <input id="sid" autocomplete="username" required autofocus></label>
      <label>비밀번호
        <input id="pw" type="password" autocomplete="off" required></label>
      <button type="submit" class="primary">로그인</button>
      <div class="tour">
        <p>처음이라면 예시 데이터로 바로 둘러보세요</p>
        <div>
          <button type="button" id="tourStudent">학생으로 둘러보기</button>
          <button type="button" id="tourStaff">교직원으로 둘러보기</button>
        </div>
      </div>
      <p class="notice"><strong>지금은 시험 버전이에요.</strong> 아무 값이나 넣어도 들어가지고, 비밀번호는 어디에도 저장하지 않아요.
        인하포털 비밀번호는 넣지 마세요.</p>
      <p class="hint">인하대학교 공식 서비스가 아니에요. 학생이 만든 비교과 안내 사이트예요. 마스코트 안뇽·인덕의 저작권은 인하대학교에 있어요.</p>
    </form>
  </main>

<script src="js/data.js?v=29"></script>
<script src="js/logic.js?v=29"></script>
<script src="js/demo.js?v=29"></script>
<script>
  // shortcut: 진짜 로그인이 아님. 학번(교직원은 사번)만 이 브라우저에 기억하고 비밀번호는 버림. 이름·학과는 마이페이지에서 적음. 서버(Supabase)나 학교 로그인으로 바꿀 때 이 부분을 교체.
  const $ = (id) => document.getElementById(id);
  // 학생과 교직원이 같은 화면에서 로그인. 교직원 화면에서 넘어오면(login.html?staff) 교직원이 미리 골라져 있음.
  if (new URLSearchParams(location.search).has('staff')) document.querySelector('[name=who][value=staff]').checked = true;
  // 학생을 고르면 "학번", 교직원을 고르면 "사번"
  const showLabel = () => { $('idLabel').textContent = document.querySelector('[name=who]:checked').value === 'staff' ? '사번' : '학번'; };
  document.querySelector('.who').addEventListener('change', showLabel);
  showLabel();
  $('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const staff = document.querySelector('[name=who]:checked').value === 'staff';
    // 직접 로그인하면 시연은 끝난 것으로 봄
    try { localStorage.removeItem(DEMO_FLAG); localStorage.setItem(staff ? 'inha-staff-session' : 'inha-session', $('sid').value.trim()); } catch { /* 저장소를 못 써도 들어가게 함 */ }
    location.href = staff ? 'admin.html' : 'index.html';
  });
  // 둘러보기: 예시 데이터를 채우고 시연 학생·교직원으로 바로 들어감 (js/demo.js)
  const tour = (to) => () => {
    let has = false;
    try { has = Boolean(localStorage.getItem('inha-apply-demo-v1') || localStorage.getItem('inha-team-posts-v1')) && !localStorage.getItem(DEMO_FLAG); } catch { /* 아래에서 처리 */ }
    if (has && !confirm('이 브라우저에 저장된 신청과 글을 예시 데이터로 바꿀까요?')) return;
    try { seedDemo(); } catch { alert('이 브라우저는 저장소를 쓸 수 없어서 둘러보기를 시작하지 못했어요.'); return; }
    location.href = to;
  };
  $('tourStudent').addEventListener('click', tour('index.html'));
  $('tourStaff').addEventListener('click', tour('admin.html'));
</script>
</body>
</html>
