<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팀원 구하기 · 인하 비교과 마일리지</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css?v=10">
</head>
<body>
<main>
  <header class="top">
    <h1 id="name"></h1>
    <a href="programs.html">프로그램 목록으로</a>
  </header>
  <p class="sub" id="summary"></p>
  <p class="notice"><strong>지금은 시험 버전이에요.</strong> 쓴 글은 이 브라우저에만 저장돼서 다른 사람에게는 아직 보이지 않아요.</p>

  <h2 id="write-title" style="margin-top:32px">팀원 구하는 글 쓰기</h2>
  <form id="postForm" class="fields" aria-labelledby="write-title">
    <label class="wide">제목
      <input id="title" maxlength="60" required placeholder="예: 자료구조 같이 공부할 2명 구해요"></label>
    <label class="wide">내용
      <textarea id="body" rows="4" maxlength="1000" required placeholder="어떤 팀을 만들고 싶은지, 언제 모일 수 있는지 적어주세요."></textarea></label>
    <label class="wide">연락 방법
      <input id="contact" maxlength="100" required placeholder="예: 오픈채팅 링크, 인스타 아이디"></label>
    <p class="hint wide">전화번호나 학번 같은 개인정보는 적지 않는 게 좋아요. 글쓴이는 "22학번"처럼 입학 연도만 보여요.</p>
    <div class="actions wide"><button type="submit" class="primary">글 올리기</button></div>
  </form>

  <h2 id="posts-title">올라온 글 <small id="count"></small></h2>
  <ul id="posts" class="posts" aria-labelledby="posts-title"></ul>
  <p id="empty" class="empty">아직 글이 없어요. 첫 글을 써보세요.</p>
</main>
<script src="js/data.js?v=10"></script>
<script src="js/logic.js?v=10"></script>
<script src="js/team.js?v=10"></script>
</body>
</html>
